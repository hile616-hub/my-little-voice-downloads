name: Deliver audited install-time Play update 3 to owner draft
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mlv-app-draft-442000375
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Receive encrypted signed AAB and verify draft attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRUNNER'
          # Runs only on a disposable GitHub-hosted runner. No application signing keys are used.
          import os,json,subprocess,time,tempfile,hashlib,base64,shutil,zipfile
          from pathlib import Path
          from urllib.parse import quote
          os.umask(0o077)
          SPEC=json.loads('{"repository": "hile616-hub/my-little-voice-downloads", "tag": "store-test-1", "releaseId": 442000375, "file": "My-Little-Voice-Play-3-pr27-transfer.zip", "path": "/workspace/My-Little-Voice-Play-3-pr27-transfer.zip", "bytes": 263502282, "sha256": "18cdb0b3ca7eb31b7fbd37214404741011f6dc821cea09b62cc46d5c95b8a95d", "chunks": 8, "files": {"My-Little-Voice-3-Play.aab": {"bytes": 263783795, "sha256": "7474d998e5e7615ebbe7ed240b24d6a00328a71f2dae91b6fb0fe5859b3a7e7c"}, "Play-3-README.txt": {"bytes": 1516, "sha256": "d1df83920159255ce07225f4f5b97af4fec1181a1412d15eb7c05a8ad07ba075"}, "Play-3-aab-audit.json": {"bytes": 880, "sha256": "cc3d063058021f29eb80408b357f6d8c979d3b3a2bbc4cd323f49ea2524d79df"}, "Play-3-artwork-privacy-audit.json": {"bytes": 614, "sha256": "e190cdf7ffa434cab15d3d89c6d6a755e90d0d4dc6669e2be4c3702d5691acf7"}, "Play-3-build.json": {"bytes": 785, "sha256": "bf0b21ea5a90869be3b1594b6511116f11af3adfbe08bb1317901bac8bbdf434"}, "Play-3-checks.json": {"bytes": 3729, "sha256": "916660237dc4f693ee04d3325a3d2dd72ed505aec99bee761cf977e625420c99"}, "Play-3-signing-verification.json": {"bytes": 653, "sha256": "7cde2457555f6ec30f87c7981ebfa87b746bef549d9b92f5988d3905870fc83c"}, "Play-3-SHA256SUMS": {"bytes": 633, "sha256": "3320caa5124819a646161330e5d60bfa30896c467242972461559e4dacbedb04"}}, "source": "32b0d5872be6f045fec39cfe2531bb4892217263"}')
          BASELINE=set(['My-Little-Voice-1-GetApps.apk', 'My-Little-Voice-1-Play.aab', 'My-Little-Voice-2-Play.aab', 'Play-2-README.txt', 'Play-2-SHA256SUMS', 'Play-2-aab-audit.json', 'Play-2-artwork-audit.json', 'Play-2-build.json', 'Play-2-checks.json', 'README.txt', 'SHA256SUMS', 'aab-audit.json', 'apk-audit.json', 'audit-summary.json', 'build.json', 'voice-download-verification.json'])
          REPO='hile616-hub/my-little-voice-downloads';RELEASE=442000375
          APP_TAG='store-test-1'
          NAME=SPEC['file'];SIZE=SPEC['bytes']
          SHA=SPEC['sha256']
          run_id=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          branch=f'temporary/encrypted-store-transfer-{run_id}-{attempt}'
          prefix=f'store-transfer/{run_id}-{attempt}'
          work=Path(tempfile.mkdtemp(prefix='mlv-encrypted-transfer-',dir=os.environ['RUNNER_TEMP']))
          def run(args,**kwargs):
           try:result=subprocess.run(args,timeout=kwargs.pop('timeout',40),capture_output=True,**kwargs)
           except subprocess.TimeoutExpired:raise RuntimeError('Bounded runner command timed out; sensitive arguments suppressed') from None
           if result.returncode:
            if args[0]=='gh':raise RuntimeError('GitHub command failed: '+result.stderr.decode())
            raise RuntimeError('Runner command failed: '+args[0]+'; sensitive arguments suppressed')
           return result
          def api(path,method='GET',data=None,missing=False):
           args=['gh','api',f'repos/{REPO}/'+path,'--method',method]
           if data is not None:
            request=work/'request.json';request.write_text(json.dumps(data));args+=['--input',str(request)]
           result=subprocess.run(args,capture_output=True,text=True,timeout=25)
           if result.returncode:
            if missing and 'HTTP 404' in result.stderr:return None
            raise RuntimeError('GitHub API failed: '+result.stderr)
           return json.loads(result.stdout) if result.stdout.strip() else None
          def draft():
           release=api(f'releases/{RELEASE}')
           if release['id']!=RELEASE or release['tag_name']!=APP_TAG or not release['draft']:raise RuntimeError('The existing release must remain unpublished')
           return release
          try:
           draft()
           # This is an ephemeral TRANSPORT decryption key, unrelated to APK/model signing keys.
           private=work/'transport-private.pem';public=work/'transport-public.pem'
           run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:3072','-out',str(private)])
           run(['openssl','pkey','-in',str(private),'-pubout','-out',str(public)])
           public_bytes=public.read_bytes();public_sha=hashlib.sha256(public_bytes).hexdigest()
           api('git/refs','POST',{'ref':'refs/heads/'+branch,'sha':os.environ['GITHUB_SHA']})
           api('contents/'+prefix+'/public-key.pem','PUT',{'branch':branch,'message':'Publish one-time transport public key for verified model transfer','content':base64.b64encode(public_bytes).decode()})
           print('Waiting for encrypted model transfer on '+branch,flush=True)
           print('One-time transport public-key SHA-256: '+public_sha,flush=True)
           deadline=time.monotonic()+600
           while time.monotonic()<deadline:
            ready=api('contents/'+prefix+'/ready.json?ref='+quote(branch,safe=''),missing=True)
            if ready is not None:break
            time.sleep(5)
           else:raise TimeoutError('Bounded encrypted transfer handoff timed out')
           head=api('git/ref/heads/'+branch)['object']['sha']
           checkout=work/'encrypted'
           run(['git','clone','--depth','1','--single-branch','--branch',branch,'https://github.com/'+REPO+'.git',str(checkout)],timeout=90)
           actual=run(['git','-C',str(checkout),'rev-parse','HEAD']).stdout.decode().strip()
           if actual!=head:raise RuntimeError('Transfer branch changed during checkout; refusing an unpinned tree')
           folder=checkout/prefix;m=json.loads((folder/'ready.json').read_text())
           assert m['runId']==run_id and m['attempt']==attempt and m['publicKeySha256']==public_sha
           assert m['file']==NAME and m['bytes']==SIZE and m['sha256']==SHA
           assert len(m['chunks'])==SPEC['chunks']
           encrypted=work/'payload.enc';cipher_hash=hashlib.sha256();total=0
           with encrypted.open('xb') as out:
            for i,part in enumerate(m['chunks'],1):
             assert part['file']==f'payload-{i:03}.enc'
             assert isinstance(part['bytes'],int) and 0 < part['bytes'] <= 32*1024*1024
             assert (folder/part['file']).stat().st_size == part['bytes']
             data=(folder/part['file']).read_bytes()
             assert len(data)==part['bytes'] and hashlib.sha256(data).hexdigest()==part['sha256']
             out.write(data);cipher_hash.update(data);total+=len(data)
           assert total==SIZE and cipher_hash.hexdigest()==m['ciphertextSha256']
           envelope=work/'key-envelope.bin';material=work/'transport-material.bin'
           envelope.write_bytes(base64.b64decode(m['wrappedKeyBase64'],validate=True))
           run(['openssl','pkeyutl','-decrypt','-inkey',str(private),'-in',str(envelope),'-out',str(material),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256'])
           secret=material.read_bytes();assert len(secret)==48
           pack=work/NAME
           # Values remain in this subprocess; never print argv or secret material.
           run(['openssl','enc','-aes-256-ctr','-d','-K',secret[:32].hex(),'-iv',secret[32:].hex(),'-in',str(encrypted),'-out',str(pack)],timeout=60)
           assert pack.stat().st_size==SIZE
           with pack.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==SHA
           EXPECTED=SPEC['files']
           uploads=work/'signed-files';uploads.mkdir()
           with zipfile.ZipFile(pack) as archive:
            assert len(archive.namelist())==len(set(archive.namelist())) and set(archive.namelist())==set(EXPECTED)
            assert sum(item.file_size for item in archive.infolist()) < 512*1024*1024
            for name,entry in EXPECTED.items():
             assert '/' not in name and '\\' not in name and archive.getinfo(name).file_size==entry['bytes']
             digest=hashlib.sha256();total=0
             with archive.open(name) as source,(uploads/name).open('xb') as out:
              while data:=source.read(1024*1024):out.write(data);digest.update(data);total+=len(data)
             assert total==entry['bytes'] and digest.hexdigest()==entry['sha256']
           order=[name for name in EXPECTED if not name.endswith(('.aab','.apk'))]+[name for name in EXPECTED if name.endswith('.aab')]+[name for name in EXPECTED if name.endswith('.apk')]
           results=[]
           for name in order:
            path=uploads/name;entry=EXPECTED[name];release=draft()
            assert {a['name'] for a in release['assets']} <= set(EXPECTED)|BASELINE
            existing=next((a for a in release['assets'] if a['name']==name),None)
            if existing is None:run(['gh','release','upload',APP_TAG,str(path),'--repo',REPO],timeout=180)
            release=draft();asset=next(a for a in release['assets'] if a['name']==name)
            assert asset['size']==entry['bytes']
            if asset.get('digest'):assert asset['digest']=='sha256:'+entry['sha256']
            else:
             download=work/('recheck-'+name)
             with download.open('xb') as out:
              subprocess.run(['gh','api',f'repos/{REPO}/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=out,stderr=subprocess.PIPE,check=True,timeout=180)
             with download.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==entry['sha256']
            results.append({'id':asset['id'],'name':name,'bytes':asset['size'],'sha256':entry['sha256'],'serverDigest':asset.get('digest')})
           assert {a['name'] for a in draft()['assets']}==set(EXPECTED)|BASELINE
           result={'releaseId':RELEASE,'htmlUrl':draft()['html_url'],'draft':True,'assets':results,'transferCommit':head,'privateSigningMaterialUsed':False,'storeUploadPerformed':False}
           print(json.dumps(result,indent=2),flush=True)
           with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:summary.write('## Verified signed app files and audits\n\nUnpublished owner download; no store upload.\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          finally:
           # Only disposable transport files are erased. Original model and signing keys never enter this runner.
           shutil.rmtree(work)
          PYRUNNER
